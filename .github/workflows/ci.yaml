name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# All jobs only read the repo (build/test/lint/package/codegen-check).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test_dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test

  test_release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release
    - name: Test
      run: cargo test --release

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Rustfmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy -- -Dwarnings

  check_capnp_generated:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Regenerate capnp code
      run: make -C hyperfuel-net-types generate_capnp_types
    - name: Verify committed capnp code is up to date
      run: |
          git diff --exit-code -- hyperfuel-net-types/src/__generated__ \
            || (echo "::error::Committed capnp code is out of date. Run 'make -C hyperfuel-net-types generate_capnp_types' and commit the result." && exit 1)

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Verify publishable crates package correctly
      run: |
          cargo package -p hyperfuel-format
          cargo package -p hyperfuel-schema
          cargo package -p hyperfuel-net-types
          # --no-verify is temporary: a full verify-build would compile the
          # currently published (build.rs-based) hyperfuel-net-types from
          # crates.io. Drop it once a pre-built hyperfuel-net-types is released.
          cargo package -p hyperfuel-client --no-verify