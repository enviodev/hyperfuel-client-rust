name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test_dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test

  test_release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release
    - name: Test
      run: cargo test --release

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Rustfmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy -- -Dwarnings

  # The capnp-generated code is committed rather than built from build.rs, so it
  # can drift from the schema if someone edits the .capnp file without
  # regenerating. Regenerate here and fail if the committed code is stale.
  check_capnp_generated:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Install capnp schema compiler
      run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y capnproto libcapnp-dev
    # Pin the plugin to the EXACT version that produced the committed code: the
    # generated bytes depend on the capnpc-rust version, so a floating "^0.19"
    # could produce a spurious diff. This must stay compatible with the `capnp`
    # runtime dependency in hyperfuel-net-types/Cargo.toml.
    - name: Install capnpc-rust plugin
      run: cargo install capnpc --version "=0.19.0"
    - name: Regenerate capnp code
      run: make -C hyperfuel-net-types generate_capnp_types
    - name: Verify committed capnp code is up to date
      run: |
          git diff --exit-code -- hyperfuel-net-types/src/__generated__ \
            || (echo "::error::Committed capnp code is out of date. Run 'make -C hyperfuel-net-types generate_capnp_types' and commit the result." && exit 1)

  # Verify the publishable crates package and verify-build correctly. No capnp
  # compiler is needed: hyperfuel-net-types now ships pre-built code, and the
  # other crates don't use capnp. hyperfuel-client is packaged with --no-verify
  # because its verify-build would compile the *currently published*
  # hyperfuel-net-types (still build.rs-based) from crates.io; switch it to a
  # full `cargo package` once a pre-built hyperfuel-net-types is released.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - name: Verify publishable crates package correctly
      run: |
          cargo package -p hyperfuel-format
          cargo package -p hyperfuel-schema
          cargo package -p hyperfuel-net-types
          cargo package -p hyperfuel-client --no-verify